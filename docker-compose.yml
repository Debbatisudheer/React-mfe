version: "3.9"

services:

  mongodb:
    image: mongo:6
    container_name: mongodb
    ports:
      - "27017:27017"
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./backend
    container_name: backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    depends_on:
      - mongodb
    restart: always

  shell:
    build: ./shell-app
    container_name: shell
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: always

  menu:
    build: ./menu-app
    container_name: menu
    ports:
      - "5174:5174"
    depends_on:
      - shell
    restart: always

  cart:
    build: ./cart-app
    container_name: cart
    ports:
      - "5175:5175"
    depends_on:
      - shell
    restart: always

  login:
    build: ./login-app
    container_name: login
    ports:
      - "5176:5176"
    depends_on:
      - backend
    restart: always

volumes:
  mongo-data:
